<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>대한민국 환경 탐험대 – 바다를 품은 부산광역시</title>
<style>
:root{--ink:#2a2140;--card:#fffdf7;--line:#ffffff;--bs:#3a8cff;--pc:#ff7a59;--nj:#6cc04a;--gold:#ffcf33;--nat:#34b26b;--hum:#5b7cfa;--shadow:0 6px 0 rgba(42,33,64,.18),0 14px 30px rgba(42,33,64,.18);
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nanum Gothic",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe3ff;font-family:var(--font);color:var(--ink);touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:var(--font);cursor:pointer;border:none;color:inherit}
.hidden{display:none!important}
/* ---------- 공통 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border-radius:18px;font-size:20px;font-weight:900;color:#fff;
  background:linear-gradient(#ffb340,#ff8a1f);box-shadow:0 6px 0 #c95f00,0 10px 18px rgba(0,0,0,.18);transition:transform .08s,box-shadow .08s;letter-spacing:-.3px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c95f00,0 4px 8px rgba(0,0,0,.18)}
.btn.blue{background:linear-gradient(#6ec3ff,#3a8cff);box-shadow:0 6px 0 #1f5fc4,0 10px 18px rgba(0,0,0,.18)}
.btn.green{background:linear-gradient(#7ee07a,#33b34a);box-shadow:0 6px 0 #1f7f30,0 10px 18px rgba(0,0,0,.18)}
.btn.purple{background:linear-gradient(#b58cff,#7b4dff);box-shadow:0 6px 0 #4f27c4,0 10px 18px rgba(0,0,0,.18)}
.btn.gray{background:linear-gradient(#c9ced8,#9aa2b2);box-shadow:0 6px 0 #6b7384,0 10px 18px rgba(0,0,0,.12)}
.btn.small{padding:10px 16px;font-size:16px;border-radius:14px}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#questPanel{position:absolute;left:max(14px,env(safe-area-inset-left));top:14px;width:min(380px,44vw)}
.regionChip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 10px;border-radius:999px;background:var(--pc);color:#fff;font-weight:900;font-size:17px;box-shadow:var(--shadow);border:3px solid #fff}
.regionChip .dot{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px}
.questCard{margin-top:10px;background:var(--card);border:4px solid #fff;border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.questCard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--gold)}
.qLabel{font-size:13px;font-weight:900;color:#c77800;letter-spacing:.5px}
#qTitle{font-size:19px;font-weight:900;margin-top:2px;line-height:1.3}
#qHint{font-size:14px;color:#6a6080;margin-top:4px;line-height:1.35;font-weight:700}
#qDist{position:absolute;right:12px;top:10px;font-size:13px;font-weight:900;color:#fff;background:#ff8a3d;border-radius:999px;padding:2px 10px}
#mapWrap{position:absolute;right:max(14px,env(safe-area-inset-right));top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#miniBox{width:min(190px,24vw);height:min(190px,24vw);border-radius:50%;border:5px solid #fff;box-shadow:var(--shadow);overflow:hidden;background:#9fd3ff;position:relative;cursor:pointer;transition:all .25s}
#miniBox.big{width:min(560px,80vw);height:min(560px,80vw);border-radius:28px}
#mini{width:100%;height:100%;display:block}
#miniN{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 3px #000}
.mapBtns{display:flex;gap:8px}
.roundBtn{width:52px;height:52px;border-radius:50%;background:#fff;font-size:24px;box-shadow:var(--shadow);display:grid;place-items:center}
.roundBtn:active{transform:scale(.92)}
#bottomBar{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:flex-end;gap:14px;pointer-events:none}
#bottomBar>*{pointer-events:auto}
#lvBox{display:flex;align-items:center;gap:10px;background:var(--card);border:4px solid #fff;border-radius:22px;padding:8px 14px;box-shadow:var(--shadow)}
#lvBadge{background:linear-gradient(#ffd84d,#ffb300);color:#7a4a00;font-weight:900;border-radius:14px;padding:6px 10px;font-size:15px;border:3px solid #fff;box-shadow:0 3px 0 #c98a00}
#lvBadge b{font-size:22px}
#xpBar{width:min(220px,22vw);height:22px;background:#e8e2f5;border-radius:999px;position:relative;overflow:hidden;border:3px solid #fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
#xpFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7ee07a,#33c7a0);border-radius:999px;transition:width .5s cubic-bezier(.3,1.4,.6,1)}
#xpText{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;color:#2a2140}
#coins{font-weight:900;font-size:18px;background:#fff6d6;border-radius:12px;padding:4px 10px;border:2px solid #ffe08a}
#coins.bump{animation:bump .4s}
#menuBtns{display:flex;gap:10px}
#menuBtns button{position:relative;width:76px;height:76px;border-radius:22px;background:var(--card);border:4px solid #fff;box-shadow:var(--shadow);font-size:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#menuBtns button span{font-size:13px;font-weight:900;margin-top:4px}
#menuBtns button i{position:absolute;top:-8px;right:-8px;background:#ff4d6d;color:#fff;font-style:normal;font-size:12px;font-weight:900;border-radius:999px;padding:3px 7px;border:2px solid #fff}
#menuBtns button:active{transform:translateY(4px)}
#btnFinal{background:linear-gradient(#fff3b0,#ffd23f)!important;animation:pulse 1.4s infinite}
#prompt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(42,33,64,.88);color:#fff;border-radius:999px;padding:10px 22px 10px 12px;font-size:19px;font-weight:900;display:flex;align-items:center;gap:10px;border:3px solid #fff;box-shadow:var(--shadow);animation:pop .25s;cursor:pointer;white-space:nowrap}
#prompt kbd{background:#ffcf33;color:#2a2140;border-radius:10px;padding:4px 10px;font-family:var(--font);font-weight:900;box-shadow:0 3px 0 #c98a00}
#toasts{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:5}
.toast{background:#fff;border:4px solid var(--gold);border-radius:18px;padding:10px 20px;font-weight:900;font-size:18px;box-shadow:var(--shadow);animation:toastIn .35s cubic-bezier(.3,1.5,.6,1);white-space:nowrap}
.toast.out{animation:toastOut .3s forwards}
.toast.mission{border-color:#7b4dff;background:linear-gradient(#fff,#f2ebff);font-size:21px}
#combo{position:absolute;right:max(20px,env(safe-area-inset-right));top:50%;font-weight:900;font-size:42px;color:#ff4d6d;text-shadow:0 4px 0 #fff,0 0 20px #fff;transform:rotate(-8deg);animation:comboPop .5s}
#timer{position:absolute;left:50%;top:84px;transform:translateX(-50%);background:#ff4d6d;color:#fff;font-weight:900;font-size:26px;border-radius:999px;padding:8px 24px;border:4px solid #fff;box-shadow:var(--shadow)}
/* ---------- 터치 조작 ---------- */
#touch{position:absolute;inset:0;pointer-events:none}
#touch>*{pointer-events:auto}
#joy{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:120px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.28);border:4px solid rgba(255,255,255,.7);box-shadow:0 8px 20px rgba(0,0,0,.15);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd84d);border:4px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.tBtn{position:absolute;border-radius:50%;background:rgba(255,255,255,.9);border:4px solid #fff;box-shadow:var(--shadow);font-weight:900;display:grid;place-items:center;touch-action:none}
#tJump{right:max(28px,env(safe-area-inset-right));bottom:130px;width:84px;height:84px;font-size:15px}
#tAct{right:max(124px,calc(env(safe-area-inset-right) + 110px));bottom:180px;width:96px;height:96px;font-size:34px;background:linear-gradient(#ffe066,#ffb300);opacity:.45}
#tAct.on{opacity:1;animation:pulse 1s infinite}
#tZoomIn,#tZoomOut{right:max(28px,env(safe-area-inset-right));width:52px;height:52px;font-size:26px}
#tZoomIn{bottom:300px}#tZoomOut{bottom:236px}
/* ---------- 대화 ---------- */
#dialog{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(860px,94vw);background:var(--card);border:5px solid #fff;border-radius:28px;box-shadow:var(--shadow);padding:20px 26px 20px 150px;min-height:150px;z-index:20;cursor:pointer;animation:slideUp .3s}
#dlgFace{position:absolute;left:18px;top:-30px;width:116px;height:116px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ffe9b3);border:5px solid #fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:66px}
#dlgName{position:absolute;left:150px;top:-20px;background:#7b4dff;color:#fff;font-weight:900;border-radius:999px;padding:6px 18px;font-size:17px;border:3px solid #fff}
#dlgText{font-size:22px;font-weight:800;line-height:1.55;margin-top:6px;min-height:68px}
#dlgNext{position:absolute;right:22px;bottom:12px;font-size:15px;font-weight:900;color:#7b4dff;animation:blink 1s infinite}
/* ---------- 모달 ---------- */
#modalBg{position:fixed;inset:0;background:rgba(30,20,60,.42);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:30;animation:fade .2s}
#modal{width:min(760px,94vw);max-height:92vh;overflow:auto;background:var(--card);border:6px solid #fff;border-radius:32px;box-shadow:0 10px 0 rgba(42,33,64,.2),0 30px 60px rgba(0,0,0,.3);padding:26px 28px;position:relative;animation:pop .3s cubic-bezier(.3,1.5,.6,1)}
#modal.wide{width:min(980px,96vw)}
.mClose{position:absolute;right:14px;top:14px;width:46px;height:46px;border-radius:50%;background:#ff6b6b;color:#fff;font-size:24px;font-weight:900;box-shadow:0 4px 0 #c43c3c;z-index:2}
.mHead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mHead h2{margin:0;font-size:28px;font-weight:900;letter-spacing:-.5px}
.tag{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px;color:#fff}
.tag.N{background:var(--nat)}.tag.H{background:var(--hum)}.tag.bs{background:var(--bs)}.tag.pc{background:var(--pc)}.tag.nj{background:var(--nj)}
.obsIcon{width:120px;height:120px;border-radius:30px;display:grid;place-items:center;font-size:72px;background:radial-gradient(circle at 40% 35%,#fff,#e9f6ff);border:5px solid #fff;box-shadow:var(--shadow);flex:none;animation:wobble 2s infinite}
.obsTop{display:flex;gap:20px;align-items:center}
.obsName{font-size:32px;font-weight:900;letter-spacing:-.6px}
.obsDesc{font-size:20px;font-weight:700;line-height:1.55;margin-top:6px;color:#4a4060}
.askQ{margin:22px 0 12px;font-size:22px;font-weight:900;text-align:center}
.twoBtns{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bigChoice{padding:18px 10px;border-radius:24px;font-size:24px;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.2}
.bigChoice small{font-size:14px;font-weight:800;opacity:.92}
.bigChoice.N{background:linear-gradient(#5fdc8f,#24a85a);box-shadow:0 7px 0 #187a40}
.bigChoice.H{background:linear-gradient(#8aa4ff,#4a67f0);box-shadow:0 7px 0 #2f45b8}
.bigChoice:active{transform:translateY(5px)}
.bigChoice .em{font-size:44px}
.helpBox{margin-top:16px;background:#f3efff;border-radius:18px;padding:12px 16px;font-size:16px;font-weight:700;line-height:1.5;color:#4a4060}
.result{margin-top:16px;border-radius:22px;padding:16px 20px;font-size:19px;font-weight:800;line-height:1.55;animation:pop .3s}
.result.ok{background:#e7fbe9;border:4px solid #7ee07a}
.result.no{background:#fff0f0;border:4px solid #ff9a9a}
.result h3{margin:0 0 6px;font-size:26px}
.reward{display:inline-flex;gap:10px;margin-top:8px;font-size:17px;font-weight:900}
.reward span{background:#fff;border-radius:999px;padding:4px 12px;border:3px solid #ffe08a}
.center{text-align:center}
.mt{margin-top:18px}
.quizQ{font-size:24px;font-weight:900;line-height:1.45;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px 16px 62px;margin:10px 0;border-radius:20px;background:#fff;border:4px solid #e8e2f5;font-size:19px;font-weight:800;line-height:1.4;position:relative;box-shadow:0 4px 0 #e0d9f0;transition:transform .1s}
.opt b{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:#7b4dff;color:#fff;display:grid;place-items:center;font-size:18px}
.opt:active{transform:translateY(3px)}
.opt.wrong{background:#fff0f0;border-color:#ff9a9a;animation:shake .4s;opacity:.6}
.opt.right{background:#e7fbe9;border-color:#5fdc8f}
.opt:disabled{cursor:default}
/* 도감 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{padding:10px 18px;border-radius:999px;background:#eee8fb;font-weight:900;font-size:16px}
.tab.on{background:#7b4dff;color:#fff;box-shadow:0 4px 0 #4f27c4}
.progress{height:26px;background:#ece6fb;border-radius:999px;overflow:hidden;position:relative;border:3px solid #fff;box-shadow:inset 0 2px 5px rgba(0,0,0,.1)}
.progress div{height:100%;background:linear-gradient(90deg,#ffcf33,#ff8a3d,#ff4d6d);border-radius:999px;transition:width .6s}
.progress span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:14px}
.dexCols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.dexCol h4{margin:0 0 8px;font-size:19px;padding:8px 14px;border-radius:14px;color:#fff}
.dexCol.N h4{background:var(--nat)}.dexCol.H h4{background:var(--hum)}
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.dexCard{background:#fff;border:4px solid #f0ebfa;border-radius:18px;padding:10px 4px;text-align:center;font-weight:900;font-size:13px;line-height:1.25;position:relative;min-height:104px}
.dexCard .em{font-size:38px;display:block;margin-bottom:4px}
.dexCard.unk{background:#f4f2f8;color:#b7b0c8}
.dexCard.unk .em{filter:grayscale(1) brightness(.4);opacity:.35}
.dexCard .star{position:absolute;top:-8px;right:-6px;font-size:18px}
.dexCard.got{cursor:pointer;animation:pop .3s}
.dexCard.got:hover{border-color:#ffcf33}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:#fff;border:4px solid #f0ebfa;border-radius:22px;padding:14px;text-align:center;font-weight:900}
.badge .em{font-size:52px;display:block}
.badge.lock{opacity:.35;filter:grayscale(1)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.album figure{margin:0;background:#fff;padding:8px 8px 4px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,.12);transform:rotate(-1.5deg)}
.album figure:nth-child(2n){transform:rotate(1.8deg)}
.album img{width:100%;border-radius:6px;display:block}
.album figcaption{font-size:14px;font-weight:900;text-align:center;padding:4px}
/* 미션 목록 */
.mList{display:flex;flex-direction:column;gap:8px}
.mItem{display:flex;align-items:center;gap:12px;background:#fff;border:4px solid #f0ebfa;border-radius:18px;padding:10px 14px;cursor:pointer;font-weight:800;font-size:17px}
.mItem.done{background:#f1fbf2;border-color:#c9efcc;color:#5a8c5f}
.mItem.track{border-color:#ffcf33;box-shadow:0 0 0 3px #fff3b0}
.mItem .ck{width:34px;height:34px;border-radius:50%;background:#efeaf9;display:grid;place-items:center;font-size:18px;flex:none}
.mItem.done .ck{background:#5fdc8f;color:#fff}
.mItem .side{margin-left:auto;font-size:12px;background:#ffefd6;color:#c77800;border-radius:999px;padding:3px 9px;flex:none}
/* 짝 맞추기 */
.matchWrap{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:10px}
.mCol{display:flex;flex-direction:column;gap:10px}
.mCol h4{margin:0;text-align:center;color:#fff;border-radius:14px;padding:8px;font-size:18px}
.mCard{padding:16px 10px;border-radius:18px;background:#fff;border:4px solid #e8e2f5;font-size:20px;font-weight:900;box-shadow:0 4px 0 #e0d9f0;position:relative}
.mCard.sel{border-color:#ffcf33;background:#fffbe6;transform:scale(1.04)}
.mCard.done{opacity:.95;border-color:#5fdc8f;background:#e7fbe9}
.mCard.done:after{content:attr(data-n);position:absolute;right:-10px;top:-10px;width:30px;height:30px;border-radius:50%;background:#5fdc8f;color:#fff;display:grid;place-items:center;font-size:15px;border:3px solid #fff}
.mCard.bad{animation:shake .4s;border-color:#ff9a9a}
/* 의상 */
.shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.shopItem{background:#fff;border:4px solid #f0ebfa;border-radius:20px;padding:12px;text-align:center;font-weight:900}
.shopItem.on{border-color:#7b4dff;box-shadow:0 0 0 3px #e3d8ff}
.swatch{width:60px;height:60px;border-radius:50%;margin:4px auto 8px;border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2)}
/* 지역 이동 */
.travelGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tCard{border-radius:26px;padding:20px;color:#fff;font-weight:900;text-align:left;box-shadow:var(--shadow);position:relative;min-height:170px;display:flex;flex-direction:column;gap:6px}
.tCard .em{font-size:52px}.tCard .nm{font-size:23px}.tCard .sub{font-size:15px;opacity:.95}
.tCard.lock{filter:grayscale(.9);opacity:.6}
.tCard .lk{position:absolute;right:16px;top:14px;font-size:30px}
/* 최종 시험 */
#modal.boss{background:linear-gradient(#2b1f55,#4b2b8f);color:#fff;border-color:#ffd23f}
.bossTop{display:flex;align-items:center;gap:18px}
.bossFace{font-size:90px;animation:float 2s infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.bossFace.hit{animation:hit .5s}
.hp{flex:1}
.hp .bar{height:26px;background:#3d2a6e;border-radius:999px;overflow:hidden;border:3px solid #fff}
.hp .bar div{height:100%;background:linear-gradient(90deg,#ff4d6d,#ff9a3d);transition:width .5s}
.hearts{font-size:28px;margin-top:6px}
#modal.boss .quizQ{color:#fff}
#modal.boss .opt{color:var(--ink)}
.bossPic{font-size:54px;text-align:center;margin:8px 0}
.cert{background:linear-gradient(#fffdf2,#fff3c4);border:8px double #e0a800;border-radius:24px;padding:30px;text-align:center;color:#5a3d00}
.cert h1{margin:0;font-size:40px;letter-spacing:2px}
.cert .who{font-size:34px;font-weight:900;margin:14px 0;color:#2a2140}
/* 사진 모드 */
#photoUI{position:fixed;inset:0;z-index:15;pointer-events:none}
#photoUI .frame{position:absolute;inset:8% 10%;border:4px dashed rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.18)}
#photoUI .ph{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(42,33,64,.85);color:#fff;font-weight:900;font-size:19px;border-radius:999px;padding:10px 22px;white-space:nowrap}
#shutter{pointer-events:auto;position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:#fff;border:8px solid #ff4d6d;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:36px}
#shutter:active{transform:translateX(-50%) scale(.9)}
#photoClose{pointer-events:auto;position:absolute;right:20px;top:20px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .4s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* 레벨업 / 희귀 */
.overlayFx{position:fixed;inset:0;display:grid;place-items:center;z-index:45;pointer-events:none}
.overlayFx .rays{position:absolute;width:900px;height:900px;background:repeating-conic-gradient(rgba(255,230,120,.45) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 6s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%)}
.overlayFx .big{position:relative;text-align:center;animation:boing .7s cubic-bezier(.3,1.6,.5,1)}
.overlayFx .t1{font-size:78px;font-weight:900;color:#fff;-webkit-text-stroke:3px #ff8a1f;text-shadow:0 6px 0 #ff8a1f,0 12px 30px rgba(0,0,0,.3);letter-spacing:2px}
.overlayFx .t2{font-size:28px;font-weight:900;color:#2a2140;background:#fff;border-radius:999px;padding:8px 24px;display:inline-block;margin-top:8px;box-shadow:var(--shadow)}
.overlayFx .em{font-size:120px;display:block;animation:float 1.6s infinite}
/* 시작 화면 */
#start{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(80,170,255,.15),rgba(40,20,90,.35))}
.startCard{text-align:center;padding:24px;max-width:94vw}
.logoSub{display:inline-block;background:#fff;border-radius:999px;padding:8px 22px;font-weight:900;font-size:19px;color:#7b4dff;box-shadow:var(--shadow);border:3px solid #e3d8ff}
.logo{font-size:clamp(46px,9vw,98px);font-weight:900;line-height:1.02;margin:12px 0 4px;color:#fff;letter-spacing:-2px;-webkit-text-stroke:4px #2a2140;paint-order:stroke fill;text-shadow:0 8px 0 #2a2140,0 18px 40px rgba(0,0,0,.35);animation:float 3s infinite}
.logo em{font-style:normal;color:#ffd23f}
.logo2{font-size:clamp(20px,3.4vw,32px);font-weight:900;color:#fff;-webkit-text-stroke:2px #2a2140;paint-order:stroke fill;margin-bottom:22px}
.nameRow{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.nameRow input{font-family:var(--font);font-size:22px;font-weight:900;padding:14px 20px;border-radius:18px;border:4px solid #fff;box-shadow:var(--shadow);width:260px;text-align:center;outline:none;user-select:text;-webkit-user-select:text}
.nameRow label{font-weight:900;font-size:19px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.startBtns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.startBtns .btn{font-size:24px;padding:18px 34px}
.howto{margin:22px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.howto div{background:rgba(255,255,255,.92);border-radius:16px;padding:10px 14px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.howto kbd{background:#2a2140;color:#fff;border-radius:6px;padding:1px 7px;font-family:var(--font)}
#loading{position:fixed;inset:0;z-index:70;background:linear-gradient(#7cc7ff,#c7ebff);display:grid;place-items:center;font-weight:900;font-size:26px;color:#2a2140}
#loading .bus{font-size:80px;animation:drive 1s infinite}
#loading .lbar{width:300px;height:20px;border-radius:999px;background:#fff;margin:16px auto 0;overflow:hidden;border:3px solid #fff}
#loading .lbar div{height:100%;width:30%;background:linear-gradient(90deg,#ffcf33,#ff8a3d);animation:lb 1.2s infinite}
/* 애니메이션 */
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes boing{0%{transform:scale(.2)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes toastIn{from{transform:translateY(-30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-20px);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes bump{50%{transform:scale(1.3)}}
@keyframes blink{50%{opacity:.3}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes comboPop{0%{transform:rotate(-8deg) scale(2);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-14px) rotate(-8deg);filter:brightness(2)}75%{transform:translateX(14px) rotate(8deg)}}
@keyframes drive{0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px) translateY(-4px)}}
@keyframes lb{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
/* 반응형 */
@media (max-width:900px){
  #menuBtns button{width:62px;height:62px;font-size:24px;border-radius:18px}
  #menuBtns button span{font-size:11px}
  #xpBar{width:110px}
  #lvBox{padding:6px 10px;gap:6px}
  #qTitle{font-size:16px}#qHint{font-size:12px}
  .obsName{font-size:24px}.obsDesc{font-size:17px}.obsIcon{width:90px;height:90px;font-size:54px}
  .quizQ{font-size:20px}.opt{font-size:16px}
  .dexCols,.travelGrid{grid-template-columns:1fr}
  #dialog{padding:16px 18px 16px 110px}#dlgFace{width:86px;height:86px;font-size:48px}#dlgName{left:110px}#dlgText{font-size:18px}
}
@media (max-height:620px){
  #bottomBar{transform:scale(.85);transform-origin:bottom center}
  #joy{bottom:90px;width:130px;height:130px}
  #prompt{bottom:118px}
}
body.touch #prompt kbd{display:none}
body.photo #bottomBar,body.photo #questPanel,body.photo #touch #tZoomIn,body.photo #touch #tZoomOut{opacity:0;pointer-events:none}
body:not(.touch) #touch{display:none}
</style>
